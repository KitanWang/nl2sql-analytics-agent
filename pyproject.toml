[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nl2sql-agent"
version = "0.1.0"
description = "自然语言数据分析 Agent：schema 注入 + LLM 生成 SQL + AST 安全护栏 + DuckDB 执行 + 结果接地校验"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    # pyarrow 是显式依赖而不是「碰巧装了」：清洗产物与 DuckDB 的交换全部走 Parquet，
    # 缺了它 pandas 会在 to_parquet/read_parquet 上报一个很难理解的 ImportError。
    "pyarrow>=17.0",
    "numpy>=1.26",
    "pydantic>=2.9",
    "PyYAML>=6.0",
    "sqlglot>=25.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
nl2sql = "nl2sql.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nl2sql.api" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "network: 需要真实 LLM 网络调用的测试（默认跳过）",
]

[tool.coverage.run]
source = ["src/nl2sql"]
omit = ["*/api/static/*"]
